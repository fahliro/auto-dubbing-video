name: Auto Dub (ID -> EN)

# Dua run bersamaan = dua runner menghajar endpoint TTS sekaligus,
# yang memperbesar peluang kena throttle/blokir. Antrikan saja.
concurrency:
  group: auto-dub-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL langsung ke file video (mp4/mov/mkv). Kosongkan jika pakai video_path"
        required: false
        type: string
      video_path:
        description: "Path video di dalam repo (mis. input/video.mp4)"
        required: false
        default: "input/video.mp4"
        type: string
      tts_provider:
        description: "Provider TTS. 'piper' = lokal/offline (tanpa kuota & tanpa blokir IP)"
        required: false
        default: "piper"
        type: choice
        options:
          - piper
          - auto
          - groq
          - edge
      piper_voice:
        description: "Piper voice (lokal). *-medium cepat (RTF 0.15x); *-high lebih bagus tapi 6x lebih lambat"
        required: false
        default: "en_US-lessac-medium"
        type: choice
        options:
          - en_US-lessac-medium
          - en_US-amy-medium
          - en_US-kristin-medium
          - en_US-ryan-high
          - en_GB-alba-medium
      voice:
        description: "Edge TTS voice (hanya dipakai kalau provider = edge/auto)"
        required: false
        default: "en-US-AndrewNeural"
        type: string
      tts_groq_voice:
        description: "Groq Orpheus voice (provider = groq). PERHATIAN: tier gratis cuma RPM=10, RPD=100/hari"
        required: false
        default: "troy"
        type: choice
        options:
          - troy
          - austin
          - daniel
          - autumn
          - diana
          - hannah
      stt_model:
        description: "Model Whisper di Groq"
        required: false
        default: "whisper-large-v3"
        type: choice
        options:
          - whisper-large-v3
          - whisper-large-v3-turbo
      llm_model:
        description: "Model LLM untuk terjemahan (OpenAI-compatible)"
        required: false
        default: "kilo-auto/free"
        type: string
      max_speedup:
        description: "Batas maksimal percepatan audio dubbing (1.0 - 2.0)"
        required: false
        default: "1.5"
        type: string
      burn_subtitles:
        description: "Tempel subtitle bahasa Inggris ke dalam video (hardcode)"
        required: false
        default: true
        type: boolean
      subtitle_font_size:
        description: "Ukuran font subtitle (kosong = otomatis)"
        required: false
        default: ""
        type: string
      keep_original_volume:
        description: "Volume audio asli sebagai background (0 = dimatikan, mis. 0.1)"
        required: false
        default: "0"
        type: string
      tts_concurrency:
        description: "Jumlah request TTS paralel. Untuk groq biarkan 1-2 (RPM cuma 10)"
        required: false
        default: "4"
        type: string

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          pip install -U -r requirements.txt
          echo "--- versi terpasang ---"
          (pip show piper-tts 2>/dev/null | head -n 2) || true
          (pip show edge-tts 2>/dev/null | head -n 2) || true

      - name: Siapkan video input
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          mkdir -p input work
          if [ -n "$VIDEO_URL" ]; then
            curl -L --fail --retry 3 -o input/source_video "$VIDEO_URL"
            echo "VIDEO_FILE=input/source_video" >> "$GITHUB_ENV"
          elif [ -n "$VIDEO_PATH" ]; then
            test -f "$VIDEO_PATH" || { echo "File $VIDEO_PATH tidak ditemukan"; exit 1; }
            echo "VIDEO_FILE=$VIDEO_PATH" >> "$GITHUB_ENV"
          else
            echo "Isi video_url atau video_path"; exit 1
          fi

      # Model suara Piper (~63 MB) di-cache per nama voice, supaya tidak
      # download ulang tiap run.
      - name: Cache model suara Piper
        uses: actions/cache@v6
        with:
          path: .piper-voices/
          key: piper-voice-${{ inputs.piper_voice }}

      # Key cache dihitung dari ISI video (bukan nama file), supaya video dari
      # video_url tidak bentrok dengan input/video.mp4 yang ada di repo.
      - name: Hitung cache key
        id: cachekey
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            K="url-$(printf '%s' "$VIDEO_URL" | sha256sum | cut -c1-32)"
          else
            K="path-$(sha256sum "$VIDEO_PATH" | cut -c1-32)"
          fi
          # run_attempt ikut di key agar tiap percobaan bisa menyimpan progres
          # barunya sendiri; restore-keys mengambil progres attempt sebelumnya.
          echo "key=dub-work-${K}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "restore=dub-work-${K}-" >> "$GITHUB_OUTPUT"
          echo "cache key: dub-work-${K}-${{ github.run_attempt }}"

      # Cache hasil STT + translate + audio TTS per segmen.
      # Efeknya: kalau run gagal di tahap akhir, re-run tidak membayar ulang
      # kuota Groq Whisper & LLM, dan segmen yang sudah jadi tidak di-TTS ulang.
      # Aman walau key salah: dub.py memvalidasi state.json terhadap SHA-256 video.
      - name: Restore cache kerja
        id: restore-work
        uses: actions/cache/restore@v6
        with:
          path: |
            work/state.json
            work/tts_*.audio
            work/tts_*.txt
            work/clip_*.wav
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}

      # Fail fast: beberapa detik, sebelum kuota Groq STT + LLM dipakai.
      - name: Cek provider TTS
        env:
          TTS_PROVIDER: ${{ inputs.tts_provider }}
          TTS_PIPER_VOICE: ${{ inputs.piper_voice }}
          TTS_VOICE: ${{ inputs.voice }}
          TTS_GROQ_VOICE: ${{ inputs.tts_groq_voice }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/tts_probe.py

      - name: Jalankan auto dubbing
        env:
          # VIDEO_FILE sengaja tidak dideklarasikan di sini: nilai yang ditulis ke
          # $GITHUB_ENV di step atas sudah otomatis ikut ke environment step ini.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}   # mis. https://api.openai.com/v1
          LLM_MODEL: ${{ inputs.llm_model }}
          STT_MODEL: ${{ inputs.stt_model }}
          TTS_PROVIDER: ${{ inputs.tts_provider }}
          TTS_PIPER_VOICE: ${{ inputs.piper_voice }}
          TTS_VOICE: ${{ inputs.voice }}
          TTS_GROQ_VOICE: ${{ inputs.tts_groq_voice }}
          TTS_CONCURRENCY: ${{ inputs.tts_concurrency }}
          MAX_SPEEDUP: ${{ inputs.max_speedup }}
          KEEP_ORIGINAL_VOLUME: ${{ inputs.keep_original_volume }}
          BURN_SUBTITLES: ${{ inputs.burn_subtitles }}
          SUBTITLE_FONT_SIZE: ${{ inputs.subtitle_font_size }}
        run: python scripts/dub.py

      # PENTING: simpan cache walau job GAGAL. Tanpa ini, puluhan segmen yang
      # sudah berhasil di-TTS ikut terbuang (terjadi di run 38286526459:
      # 50 segmen sukses hilang karena post-step actions/cache di-skip).
      - name: Simpan cache kerja
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            work/state.json
            work/tts_*.audio
            work/tts_*.txt
            work/clip_*.wav
          key: ${{ steps.cachekey.outputs.key }}

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dubbed-video
          path: |
            output/dubbed.mp4
            output/dubbed.en.srt
            output/dub.wav
            output/segments.json
          retention-days: 7
          if-no-files-found: ignore

      # Tetap upload walau gagal: berisi output/tts_failures.json untuk debugging.
      - name: Upload bahan debug (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-info
          path: |
            output/tts_failures.json
            output/segments.json
            work/state.json
          retention-days: 7
          if-no-files-found: ignore
