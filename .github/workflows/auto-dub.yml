name: Auto Dub (ID -> EN)

# Dua run bersamaan = dua runner berat (Whisper + Piper + ffmpeg) jalan paralel.
# Antrikan saja supaya tidak saling berebut dan hasilnya mudah dilacak.
concurrency:
  group: auto-dub-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL langsung ke file video (mp4/mov/mkv). Kosongkan jika pakai video_path"
        required: false
        type: string
      video_path:
        description: "Path video di dalam repo (mis. input/video.mp4)"
        required: false
        default: "input/video.mp4"
        type: string

      stt_model:
        description: "Model faster-whisper LOKAL. turbo = akurasi mendekati large-v3 tapi jauh lebih cepat"
        required: false
        default: "large-v3-turbo"
        type: choice
        options:
          - large-v3-turbo
          - large-v3
          - medium
          - small
          - base
          - tiny
      stt_compute_type:
        description: "Presisi Whisper. int8 = tercepat & paling hemat RAM (disarankan di CPU)"
        required: false
        default: "int8"
        type: choice
        options:
          - int8
          - int8_float32
          - float32
      stt_vad_filter:
        description: "VAD: buang bagian sunyi. Matikan default; nyalakan kalau transkrip berhalusinasi saat video banyak hening"
        required: false
        default: false
        type: boolean

      tts_provider:
        description: "TTS lokal. piper = tercepat (RTF ~0.23x). kokoro = prosodi lebih natural tapi ~6x lebih lambat (RTF ~1.4x)"
        required: false
        default: "piper"
        type: choice
        options:
          - piper
          - kokoro
      piper_voice:
        description: "Piper voice (dipakai kalau tts_provider=piper). *-medium cepat; *-high lebih bagus tapi ~6x lebih lambat"
        required: false
        default: "en_US-lessac-medium"
        type: choice
        options:
          - en_US-lessac-medium
          - en_US-amy-medium
          - en_US-kristin-medium
          - en_US-ryan-high
          - en_GB-alba-medium
      kokoro_voice:
        description: "Kokoro voice (dipakai kalau tts_provider=kokoro). af_=wanita AS, am_=pria AS, bf_/bm_=Inggris"
        required: false
        default: "af_bella"
        type: choice
        options:
          - af_bella
          - af_sarah
          - af_nicole
          - af_heart
          - af_nova
          - am_adam
          - am_michael
          - am_echo
          - am_eric
          - bm_george
          - bm_lewis
          - bf_emma
          - bf_isabella

      llm_model:
        description: "Model LLM untuk terjemahan (OpenAI-compatible) -- satu-satunya panggilan cloud"
        required: false
        default: "kilo-auto/free"
        type: string
      max_speedup:
        description: "Batas maksimal percepatan audio dubbing (1.0 - 2.0)"
        required: false
        default: "1.5"
        type: string
      burn_subtitles:
        description: "Tempel subtitle bahasa Inggris ke dalam video (hardcode)"
        required: false
        default: true
        type: boolean
      subtitle_font_size:
        description: "Ukuran font subtitle (kosong = otomatis)"
        required: false
        default: ""
        type: string
      keep_original_volume:
        description: "Volume audio asli sebagai background (0 = dimatikan, mis. 0.1)"
        required: false
        default: "0"
        type: string
      tts_concurrency:
        description: "Jumlah sintesis paralel. KOSONGKAN = otomatis (piper 4, kokoro 2). Jangan set 4 untuk kokoro: terukur 3x lebih lambat di 2 vCPU"
        required: false
        default: ""
        type: string

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          pip install -U -r requirements.txt
          echo "--- versi terpasang ---"
          (pip show piper-tts 2>/dev/null | head -n 2) || true
          (pip show faster-whisper 2>/dev/null | head -n 2) || true
          echo "--- sumber daya runner ---"
          echo "vCPU : $(nproc)"
          echo "RAM  : $(free -g | awk '/^Mem:/{print $2}') GB"

      - name: Siapkan video input
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          mkdir -p input work
          if [ -n "$VIDEO_URL" ]; then
            curl -L --fail --retry 3 -o input/source_video "$VIDEO_URL"
            echo "VIDEO_FILE=input/source_video" >> "$GITHUB_ENV"
          elif [ -n "$VIDEO_PATH" ]; then
            test -f "$VIDEO_PATH" || { echo "File $VIDEO_PATH tidak ditemukan"; exit 1; }
            echo "VIDEO_FILE=$VIDEO_PATH" >> "$GITHUB_ENV"
          else
            echo "Isi video_url atau video_path"; exit 1
          fi

      # Model faster-whisper di-cache per (nama model + presisi). large-v3-turbo
      # ~1.6 GB; tanpa cache tiap run download ulang dari huggingface.co.
      - name: Cache model Whisper
        uses: actions/cache@v6
        with:
          path: .whisper-models/
          key: whisper-model-${{ inputs.stt_model }}-${{ inputs.stt_compute_type }}

      # Model suara Piper (~63 MB untuk *-medium, ~121 MB untuk *-high).
      - name: Cache model suara Piper
        uses: actions/cache@v6
        with:
          path: .piper-voices/
          key: piper-voice-${{ inputs.piper_voice }}

      # Model Kokoro (int8 92 MB) + voices-v1.0.bin (28 MB, berisi 54 voice).
      # Key tidak bergantung nama voice karena satu file voices memuat semuanya.
      - name: Cache model Kokoro
        if: inputs.tts_provider == 'kokoro'
        uses: actions/cache@v6
        with:
          path: .kokoro-models/
          key: kokoro-model-v1.0-int8

      # Key cache dihitung dari ISI video (bukan nama file), supaya video dari
      # video_url tidak bentrok dengan input/video.mp4 yang ada di repo.
      - name: Hitung cache key
        id: cachekey
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            K="url-$(printf '%s' "$VIDEO_URL" | sha256sum | cut -c1-32)"
          else
            K="path-$(sha256sum "$VIDEO_PATH" | cut -c1-32)"
          fi
          # run_id + run_attempt ikut di key supaya SETIAP run menulis entri baru.
          #
          # Sebelumnya key hanya memakai run_attempt, yang bernilai 1 untuk semua
          # run baru (hanya naik saat re-run). Akibatnya run kedua dst. gagal
          # menyimpan cache:
          #   "Failed to save: Unable to reserve cache with key ..., another job
          #    may be creating this cache."
          # dan karena step-nya pakai continue-on-error, kegagalan itu SENYAP --
          # cache membeku di isi run pertama selamanya.
          #
          # restore-keys berbasis prefix membuat restore mengambil entri paling
          # baru yang cocok, jadi progres terbaru selalu yang dipakai.
          echo "key=dub-work-${K}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "restore=dub-work-${K}-" >> "$GITHUB_OUTPUT"
          echo "cache key : dub-work-${K}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "restore   : dub-work-${K}- (prefix, ambil yang terbaru)"

      # Cache hasil STT + translate + audio TTS per segmen.
      # Efeknya: kalau run gagal di tahap akhir, re-run tidak mengulang
      # faster-whisper maupun LLM, dan segmen yang sudah jadi tidak disintesis ulang.
      # Aman walau key salah: dub.py memvalidasi state.json terhadap SHA-256 video.
      - name: Restore cache kerja
        id: restore-work
        uses: actions/cache/restore@v6
        with:
          path: |
            work/state.json
            work/tts_*.audio
            work/tts_*.txt
            work/clip_*.wav
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}

      # Fail fast: pastikan Piper + Whisper + LLM key siap SEBELUM pipeline jalan.
      # Menangkap nama model salah / download gagal / OOM dalam ~30 detik.
      - name: Preflight (TTS lokal + Whisper)
        env:
          TTS_PROVIDER: ${{ inputs.tts_provider }}
          TTS_PIPER_VOICE: ${{ inputs.piper_voice }}
          TTS_KOKORO_VOICE: ${{ inputs.kokoro_voice }}
          STT_MODEL: ${{ inputs.stt_model }}
          STT_COMPUTE_TYPE: ${{ inputs.stt_compute_type }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ inputs.llm_model }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/preflight.py

      - name: Jalankan auto dubbing
        env:
          # VIDEO_FILE sengaja tidak dideklarasikan di sini: nilai yang ditulis ke
          # $GITHUB_ENV di step atas sudah otomatis ikut ke environment step ini.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}   # mis. https://api.openai.com/v1
          LLM_MODEL: ${{ inputs.llm_model }}
          STT_MODEL: ${{ inputs.stt_model }}
          STT_COMPUTE_TYPE: ${{ inputs.stt_compute_type }}
          STT_VAD_FILTER: ${{ inputs.stt_vad_filter }}
          STT_DEVICE: cpu
          TTS_PROVIDER: ${{ inputs.tts_provider }}
          TTS_PIPER_VOICE: ${{ inputs.piper_voice }}
          TTS_KOKORO_VOICE: ${{ inputs.kokoro_voice }}
          TTS_CONCURRENCY: ${{ inputs.tts_concurrency }}
          MAX_SPEEDUP: ${{ inputs.max_speedup }}
          KEEP_ORIGINAL_VOLUME: ${{ inputs.keep_original_volume }}
          BURN_SUBTITLES: ${{ inputs.burn_subtitles }}
          SUBTITLE_FONT_SIZE: ${{ inputs.subtitle_font_size }}
          # WAJIB: tanpa ini stdout Python ter-buffer (bukan TTY), sehingga
          # seluruh log baru muncul di akhir step dan HILANG TOTAL kalau proses
          # mati keras (segfault onnxruntime / OOM-kill). Pernah terjadi.
          PYTHONUNBUFFERED: "1"
        run: python scripts/dub.py

      # PENTING: simpan cache walau job GAGAL. Tanpa ini, puluhan segmen yang
      # sudah berhasil disintesis ikut terbuang (pernah terjadi: 50 segmen hilang
      # karena post-step actions/cache di-skip saat job gagal).
      - name: Simpan cache kerja
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            work/state.json
            work/tts_*.audio
            work/tts_*.txt
            work/clip_*.wav
          key: ${{ steps.cachekey.outputs.key }}

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dubbed-video
          path: |
            output/dubbed.mp4
            output/dubbed.en.srt
            output/dub.wav
            output/segments.json
          retention-days: 7
          if-no-files-found: ignore

      # Tetap upload walau gagal: berisi output/tts_failures.json untuk debugging.
      - name: Upload bahan debug (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-info
          path: |
            output/tts_failures.json
            output/segments.json
            work/state.json
          retention-days: 7
          if-no-files-found: ignore
